name: Publish Docker Image

on:
  push:
    branches: [master, dev]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable tag to publish as a version image (e.g. v2.0.73). Omit for latest-only."
        required: false
        type: string

concurrency:
  group: docker-publish
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Version images must be built from the tagged source, not whatever
          # master currently points at. Branch pushes (e.g. the 14:00 UTC
          # promote) only refresh `latest` + a sha tag — the old behavior
          # ("max(package.json, latest stable tag)") rebuilt vX.Y.Z from
          # newer-than-tag code and silently clobbered the version image.
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve image tags
        id: version
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          # Dispatch inputs are arbitrary strings; refuse anything that is not
          # a plain semver tag. bash [[ =~ ]] anchors the WHOLE string (grep
          # would match per-line and let a multiline payload through into the
          # GITHUB_OUTPUT heredoc below).
          if [ -n "$TAG_INPUT" ] && ! [[ "$TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::invalid tag input"
            exit 1
          fi

          SHORT_SHA=$(git rev-parse --short=7 HEAD)

          # master publishes stable `latest`; dev publishes an explicitly
          # non-stable `dev` tag so fork development can be deployed without
          # moving the stable image backwards.
          CHANNEL_TAG=latest
          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            CHANNEL_TAG=dev
          fi
          PUSH_CHANNEL=true
          if [ -n "$TAG_INPUT" ]; then
            git fetch origin master --depth=1 >/dev/null 2>&1 || true
            MASTER_SHA=$(git rev-parse FETCH_HEAD 2>/dev/null || echo "")
            if [ "$(git rev-parse HEAD)" != "$MASTER_SHA" ]; then
              echo "tag $TAG_INPUT is not the master tip, skipping ${CHANNEL_TAG}"
              PUSH_CHANNEL=false
            fi
          fi

          {
            echo "tags<<EOF"
            if [ "$PUSH_CHANNEL" = "true" ]; then
              echo "type=raw,value=${CHANNEL_TAG}"
            fi
            echo "type=raw,value=sha-${SHORT_SHA}"
            if [ -n "$TAG_INPUT" ]; then
              echo "type=raw,value=${TAG_INPUT}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: ${{ steps.version.outputs.tags }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
